name: Linux Release Build

# Builds the Linux AppImage and snap with electron-builder (targets are set
# under "linux" in package.json). Runs on pushes to release/** branches, or
# manually from the Actions tab. If a draft/published GitHub release for
# this version exists, the files are attached to it too.
#
# The snap needs snapcraft from the Snap Store. When the store is down
# (it was for hours during 2.6.2), only the snap is skipped: the AppImage
# still builds and ships, and re-running later adds the snap.

on:
  workflow_dispatch:
  push:
    branches: ['release/**']

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install snapcraft
        id: snapcraft
        continue-on-error: true
        timeout-minutes: 8
        run: sudo snap install snapcraft --classic

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage and snap
        if: steps.snapcraft.outcome == 'success'
        run: npx electron-builder --linux --publish never

      - name: Build AppImage only (Snap Store unreachable)
        if: steps.snapcraft.outcome != 'success'
        run: |
          echo "::warning::snapcraft couldn't be installed (Snap Store unreachable?) -- building the AppImage only. Re-run this workflow later to add the snap."
          npx electron-builder --linux AppImage --publish never

      - name: Collect version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Triptych-${{ steps.ver.outputs.version }}-linux
          path: |
            dist/*.AppImage
            dist/*.snap
          retention-days: 14

      - name: Attach to GitHub release (if one exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          shopt -s nullglob
          files=(dist/*.AppImage dist/*.snap)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            echo "No release $TAG yet -- files are only in the run's artifacts."
          fi
